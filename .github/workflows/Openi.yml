name: Remove Override

on:
  workflow_dispatch:
  push:
    branches:
      - 1.16.5test

permissions:
  contents: write

jobs:
  remove-override:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 1.16.5test
        uses: actions/checkout@v4
        with:
          ref: 1.16.5test
          fetch-depth: 0

      - name: Remove all @Override from Java files
        shell: bash
        run: |
          set -e

          find . \
            -type f \
            -name "*.java" \
            -not -path "./.git/*" \
            -print0 |
          while IFS= read -r -d '' file; do
            if grep -q '@Override' "$file"; then
              sed -i 's/@Override//g' "$file"
              echo "Modified: $file"
            fi
          done

      - name: Commit and push
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No @Override strings found."
            exit 0
          fi

          git add -- '*.java'
          git commit -m "Remove @Override annotations"
          git push origin 1.16.5test
