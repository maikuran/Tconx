name: Generate Fluid Textures

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Generate fluid textures
        run: |
          python tex.py

      - name: Commit generated textures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/main/resources/assets/sakalti/textures/fluid

          if git diff --cached --quiet; then
            echo "No texture changes."
          else
            git commit -m "Generate fluid textures from material colors"
            git push
          fi
