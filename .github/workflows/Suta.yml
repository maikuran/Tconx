
name: Normalize Remaining Sakalti Stats

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize remaining stat values
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          root = Path(
              "src/main/resources/data/sakalti/tinkering/materials/stats"
          )

          if not root.is_dir():
              raise SystemExit(f"Directory not found: {root}")

          # These fields store multipliers relative to a baseline of 1.0.
          multiplier_fields = {
              "tconstruct:limb": (
                  "accuracy",
                  "draw_speed",
                  "velocity",
              ),
              "tconstruct:maille": (
                  "durability",
                  "armor",
                  "movement_speed",
              ),
          }

          # Armor values are absolute stats, not multipliers.
          # Never subtract 1 from armor durability or toughness.
          changed = 0

          for path in sorted(root.glob("*.json")):
              with path.open("r", encoding="utf-8") as f:
                  data = json.load(f)

              stats = data.get("stats", {})
              if not isinstance(stats, dict):
                  continue

              file_changed = False

              for stat_name, fields in multiplier_fields.items():
                  section = stats.get(stat_name)
                  if not isinstance(section, dict):
                      continue

                  for field in fields:
                      value = section.get(field)

                      if (
                          isinstance(value, (int, float))
                          and not isinstance(value, bool)
                          and value > 0.60
                      ):
                          section[field] = round(value - 1.0, 6)
                          file_changed = True

              if file_changed:
                  with path.open(
                      "w", encoding="utf-8", newline="\n"
                  ) as f:
                      json.dump(data, f, ensure_ascii=False, indent=2)
                      f.write("\n")

                  changed += 1
                  print(f"Updated: {path.name}")

          print(f"Updated {changed} files.")
          PY

      - name: Validate JSON
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          root = Path(
              "src/main/resources/data/sakalti/tinkering/materials/stats"
          )

          for path in sorted(root.glob("*.json")):
              with path.open("r", encoding="utf-8") as f:
                  json.load(f)

          print("All stat JSON files are valid.")
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/main/resources/data/sakalti/tinkering/materials/stats

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Normalize remaining Sakalti stats"
          git pull --rebase
          git push origin
