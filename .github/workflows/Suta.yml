
name: Normalize Sakalti Material Stat Values

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalize handle stat values only
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          root = Path("src/main/resources/data/sakalti/tinkering/materials/stats")

          if not root.is_dir():
              raise SystemExit(f"Stats directory not found: {root}")

          fields = (
              "durability",
              "mining_speed",
              "melee_damage",
              "melee_speed",
          )

          changed = 0

          for path in sorted(root.glob("*.json")):
              with path.open("r", encoding="utf-8") as f:
                  data = json.load(f)

              handle = data.get("stats", {}).get("tconstruct:handle")

              if not isinstance(handle, dict):
                  continue

              file_changed = False

              for key in fields:
                  value = handle.get(key)

                  if not isinstance(value, (int, float)) or isinstance(value, bool):
                      continue

                  # Original values are multipliers around 1.0.
                  # Convert them to bonuses relative to the baseline.
                  if value > 0.60 or value < -0.60:
                      new_value = round(value - 1.0, 6)
                      handle[key] = new_value
                      file_changed = True

              if file_changed:
                  with path.open("w", encoding="utf-8", newline="\n") as f:
                      json.dump(data, f, ensure_ascii=False, indent=2)
                      f.write("\n")

                  changed += 1
                  print(f"Updated stat values: {path}")

          print(f"Changed {changed} stat files.")
          PY

      - name: Validate JSON files
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          root = Path("src/main/resources/data/sakalti/tinkering/materials/stats")

          for path in sorted(root.glob("*.json")):
              with path.open("r", encoding="utf-8") as f:
                  json.load(f)

          print("All material stat JSON files are valid.")
          PY

      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/main/resources/data/sakalti/tinkering/materials/stats

          if git diff --cached --quiet; then
            echo "No stat value changes to commit."
            exit 0
          fi

          git commit -m "Normalize Sakalti handle stat values"
          git pull --rebase origin main
          git push origin HEAD:main
