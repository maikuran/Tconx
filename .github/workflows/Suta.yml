
name: Remove Molten Prefix

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  remove-molten-prefix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove molten_ from definition fluid values
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          root = Path(
              "src/main/resources/data/sakalti/tinkering/materials/definition"
          )

          if not root.is_dir():
              raise SystemExit(f"Directory not found: {root}")

          changed = 0

          for path in sorted(root.glob("*.json")):
              with path.open("r", encoding="utf-8") as f:
                  data = json.load(f)

              fluid = data.get("fluid")

              if not isinstance(fluid, str):
                  continue

              # sakalti:molten_aurostone -> sakalti:aurostone
              namespace, separator, identifier = fluid.partition(":")

              if not separator or not identifier.startswith("molten_"):
                  continue

              data["fluid"] = (
                  f"{namespace}:{identifier[len('molten_'):]}"
              )

              with path.open("w", encoding="utf-8", newline="\n") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
                  f.write("\n")

              changed += 1
              print(f"{path.name}: {fluid} -> {data['fluid']}")

          print(f"Updated {changed} definition files.")
          PY

      - name: Validate JSON files
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          root = Path(
              "src/main/resources/data/sakalti/tinkering/materials/definition"
          )

          for path in sorted(root.glob("*.json")):
              with path.open("r", encoding="utf-8") as f:
                  json.load(f)

          print("JSON validation passed.")
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/main/resources/data/sakalti/tinkering/materials/definition

          if git diff --cached --quiet; then
            echo "No molten_ prefixes to remove."
            exit 0
          fi

          git commit -m "Remove molten prefix from material definitions"
          git pull --rebase
          git push
