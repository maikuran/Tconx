name: Add missing Sakalti harvest tier keys to all locale files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-missing-keys:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Insert missing keys into all language JSON files
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          locale_dir = Path("src/main/resources/assets/sakalti/lang")
          entries = {
              "stat.tconstruct.harvest_tier.sakalti.super": "5",
              "stat.tconstruct.harvest_tier.sakalti.super_2": "6",
              "stat.tconstruct.harvest_tier.sakalti.super_3": "7",
          }

          files = sorted(locale_dir.glob("*.json"))
          if not files:
              raise SystemExit(f"No language JSON files found in {locale_dir}")

          changed = False

          for path in files:
              with path.open("r", encoding="utf-8") as f:
                  data = json.load(f)

              added_any = False
              for key, value in entries.items():
                  if key not in data:
                      data[key] = value
                      added_any = True

              if added_any:
                  with path.open("w", encoding="utf-8", newline="\n") as f:
                      json.dump(data, f, ensure_ascii=False, indent=2)
                      f.write("\n")
                  print(f"Added missing keys to {path.name}")
                  changed = True
              else:
                  print(f"No changes needed for {path.name}")

          if not changed:
              print("No locale files were modified.")
          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/assets/sakalti_lang/lang/*.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Add missing Sakalti harvest tier keys"
          git push
