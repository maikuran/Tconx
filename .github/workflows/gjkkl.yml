name: Fix Alloy Fluid Keys

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Replace fluid with name in alloy inputs
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path("src/main/resources/data/sakalti/recipes")

          if not root.exists():
              print(f"Directory not found: {root}")
              raise SystemExit(0)

          changed = 0

          for path in root.rglob("*.json"):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception as e:
                  print(f"Skip invalid JSON: {path}: {e}")
                  continue

              if data.get("type") != "tconstruct:alloy":
                  continue

              inputs = data.get("inputs", [])
              modified = False

              for ingredient in inputs:
                  if isinstance(ingredient, dict) and "fluid" in ingredient:
                      ingredient["name"] = ingredient.pop("fluid")
                      modified = True

              if modified:
                  path.write_text(
                      json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                      encoding="utf-8"
                  )
                  print(f"Fixed: {path}")
                  changed += 1

          print(f"Changed files: {changed}")

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/main/resources/data/sakalti/recipes

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Fix alloy fluid ingredient keys"
          git push
