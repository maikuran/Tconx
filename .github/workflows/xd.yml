name: Fix TConX JSON Harvest Tiers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest main
        run: |
          git config pull.rebase false
          git pull origin main

      - name: Fix harvest tier spelling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = [
              Path("src/main/resources"),
              Path("src/main/resources/data"),
          ]

          replacements = {
              '"mining_tier": "minecraft:netherrite"':
                  '"mining_tier": "minecraft:netherite"',
              '"mining_tier": "minecraft:super"':
                  '"mining_tier": "sakalti:super"',
          }

          changed = []

          seen = set()

          for root in roots:
              if not root.exists():
                  continue

              for path in root.rglob("*.json"):
                  if path in seen:
                      continue
                  seen.add(path)

                  try:
                      text = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue

                  original = text

                  for old, new in replacements.items():
                      text = text.replace(old, new)

                  if text != original:
                      path.write_text(text, encoding="utf-8")
                      changed.append(str(path))

          print("修正したJSON:")
          if changed:
              for path in changed:
                  print(f"  {path}")
          else:
              print("  なし")

      - name: Show changes
        run: |
          git diff -- src/main/resources

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "変更なし"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/main/resources
          git commit -m "Fix TConX harvest tier names"
          git push origin main
