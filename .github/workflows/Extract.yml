name: Extract Sakalti2 Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract ZIP to repository root
        shell: bash
        run: |
          set -e

          tmp_dir="$(mktemp -d)"
          unzip -q "Tconx2-1.16.5.zip" -d "$tmp_dir"

          # ZIP内の最上位ディレクトリを取得
          top_count="$(find "$tmp_dir" -mindepth 1 -maxdepth 1 | wc -l)"

          if [ "$top_count" -eq 1 ] && [ -d "$(find "$tmp_dir" -mindepth 1 -maxdepth 1 -type d)" ]; then
            source_dir="$(find "$tmp_dir" -mindepth 1 -maxdepth 1 -type d)"
          else
            source_dir="$tmp_dir"
          fi

          # 必ずリポジトリ直下を src/ にする
          rm -rf src
          mkdir -p src

          # ZIP内が src/ なら、その中身を取り出す
          if [ "$(basename "$source_dir")" = "src" ]; then
            cp -a "$source_dir"/. src/
          else
            cp -a "$source_dir"/. src/
          fi

          # src/main が存在する場合も、そのまま src/main にする
          # 例:
          # ZIP -> main/
          # Repository -> src/main/
          #
          # ZIP -> src/main/
          # Repository -> src/main/

          rm -rf "$tmp_dir"

      - name: Commit extracted files
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Extract Sakalti2 source"
          git push
