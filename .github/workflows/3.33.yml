name: Replace alloy recipe name with fluid

on:
  workflow_dispatch:

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace name with fluid in alloy recipes
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          root = Path("src/main/resources/data/sakalti/recipes")
          changed = 0

          for path in root.rglob("*.json"):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except (json.JSONDecodeError, UnicodeDecodeError):
                  continue

              if data.get("type") != "tconstruct:alloy":
                  continue

              inputs = data.get("inputs")
              if not isinstance(inputs, list):
                  continue

              modified = False
              for item in inputs:
                  if isinstance(item, dict) and "name" in item:
                      item["fluid"] = item.pop("name")
                      modified = True

              if modified:
                  path.write_text(
                      json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                      encoding="utf-8"
                  )
                  changed += 1
                  print(f"Updated: {path}")

          print(f"Total changed: {changed}")
          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/data/sakalti/recipes
          git diff --cached --quiet || git commit -m "Fix alloy recipe fluid keys"
          git pull --rebase
          git push
