name: Replace TConx

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace TConx with sakalti
        shell: bash
        run: |
          set -e

          # ファイル内容を置換
          find . \
            -type f \
            ! -path './.git/*' \
            ! -path './.github/workflows/*' \
            -print0 |
          while IFS= read -r -d '' file; do
            sed -i 's/TConx/sakalti/g' "$file"
            sed -i 's/tconx/sakalti/g' "$file"
            sed -i 's/TCOnx/sakalti/g' "$file"
            sed -i 's/tConx/sakalti/g' "$file"
          done

          # Javaパッケージのディレクトリを移動
          if [ -d "src/main/java/com/sakalti/tconx" ]; then
            mkdir -p src/main/java/com/sakalti
            mv src/main/java/com/sakalti/tconx \
               src/main/java/com/sakalti/sakalti
          fi

          # 移動後のファイルも置換
          find src -type f -print0 2>/dev/null |
          while IFS= read -r -d '' file; do
            sed -i 's/TConx/sakalti/g' "$file"
            sed -i 's/tconx/sakalti/g' "$file"
            sed -i 's/TCOnx/sakalti/g' "$file"
            sed -i 's/tConx/sakalti/g' "$file"
          done

      - name: Show changes
        run: |
          git status --short

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Rename TConx to sakalti"

      - name: Push
        run: |
          git push origin HEAD:main
