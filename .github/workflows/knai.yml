name: Replace TConx

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Replace text
        run: |
          find . -type f -not -path './.git/*' \
            -exec sed -i \
            's/TConx/sakalti/g; s/TCONX/SAKALTI/g; s/tconx/sakalti/g' {} +

      - name: Rename files and directories
        run: |
          find . -depth -not -path './.git/*' -print0 |
          while IFS= read -r -d '' path; do
            new=$(printf '%s' "$path" |
              sed 's/TConx/sakalti/g; s/TCONX/SAKALTI/g; s/tconx/sakalti/g')

            if [ "$path" != "$new" ]; then
              mv "$path" "$new"
            fi
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace TConx with sakalti" || exit 0
          git push origin main
