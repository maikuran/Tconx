name: Rename Tconx to sakalti

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace Tconx in file contents
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path(".")

          for path in root.rglob("*"):
              if not path.is_file():
                  continue

              if ".git" in path.parts:
                  continue

              try:
                  data = path.read_bytes()
              except Exception:
                  continue

              # バイナリは変更しない
              if b"\x00" in data:
                  continue

              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue

              new_text = (
                  text
                  .replace("Tconx", "sakalti")
                  .replace("tconx", "sakalti")
              )

              if new_text != text:
                  path.write_text(new_text, encoding="utf-8")
                  print(f"content: {path}")
          PY

      - name: Rename directories and files
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path(".")

          # 深い場所から順番に処理する
          paths = sorted(
              [p for p in root.rglob("*") if ".git" not in p.parts],
              key=lambda p: len(p.parts),
              reverse=True
          )

          for path in paths:
              name = path.name

              new_name = (
                  name
                  .replace("Tconx", "sakalti")
                  .replace("tconx", "sakalti")
              )

              if new_name != name:
                  new_path = path.with_name(new_name)

                  if new_path.exists():
                      print(f"SKIP: {path} -> {new_path} (already exists)")
                      continue

                  path.rename(new_path)
                  print(f"path: {path} -> {new_path}")
          PY

      - name: Show changes
        run: |
          git status --short

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Rename Tconx paths and references to sakalti"
          git push origin HEAD:main
