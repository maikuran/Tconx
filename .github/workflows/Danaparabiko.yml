
name: Repair Sakalti Tinkers' Construct Material Stats

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/main/resources/data/sakalti/tinkering/materials/stats/**/*.json"
      - ".github/workflows/repair-material-stats.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repair material stat JSON
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from decimal import Decimal, ROUND_HALF_UP
          from pathlib import Path

          ROOT = Path(
              "src/main/resources/data/sakalti/tinkering/materials/stats"
          )

          PLATING_IDS = (
              "tconstruct:plating_helmet",
              "tconstruct:plating_chestplate",
              "tconstruct:plating_leggings",
              "tconstruct:plating_boot",
              "tconstruct:plating_shield",
          )

          if not ROOT.is_dir():
              raise SystemExit(f"Directory not found: {ROOT}")

          def durability_integer(value, path, stat_id):
              if isinstance(value, bool) or not isinstance(value, (int, float)):
                  raise SystemExit(
                      f"{path}: invalid durability for {stat_id}: {value!r}"
                  )

              number = Decimal(str(value))

              if not number.is_finite() or number <= 0:
                  raise SystemExit(
                      f"{path}: durability must be finite and positive "
                      f"for {stat_id}: {value!r}"
                  )

              # Tinkers' Construct expects integer durability.
              # Round fractional values to the nearest integer.
              return int(
                  number.quantize(Decimal("1"), rounding=ROUND_HALF_UP)
              )

          files = sorted(ROOT.rglob("*.json"))

          if not files:
              raise SystemExit(f"No JSON files found in {ROOT}")

          for path in files:
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"Invalid JSON in {path}: {exc}")

              stats = data.get("stats")

              if not isinstance(stats, dict):
                  continue

              changed = False

              # Correct the old plural ID to the official singular ID.
              old_id = "tconstruct:plating_boots"
              new_id = "tconstruct:plating_boot"

              if old_id in stats:
                  if new_id in stats:
                      raise SystemExit(
                          f"{path}: both {old_id} and {new_id} exist. "
                          "Merge them manually to avoid losing data."
                      )

                  stats[new_id] = stats.pop(old_id)
                  changed = True
                  print(f"{path}: renamed {old_id} to {new_id}")

              # Normalize existing plating durability values.
              for stat_id in PLATING_IDS:
                  entry = stats.get(stat_id)

                  if entry is None:
                      continue

                  if not isinstance(entry, dict):
                      raise SystemExit(
                          f"{path}: {stat_id} must be a JSON object"
                      )

                  if "durability" not in entry:
                      continue

                  original = entry["durability"]
                  fixed = durability_integer(original, path, stat_id)

                  if type(original) is not int or original != fixed:
                      entry["durability"] = fixed
                      changed = True
                      print(
                          f"{path}: {stat_id}.durability "
                          f"{original!r} -> {fixed}"
                      )

              # Infer shield durability from existing plating stats
              # for this same material.
              if "tconstruct:plating_shield" in stats:
                  shield = stats["tconstruct:plating_shield"]

                  if not isinstance(shield, dict):
                      raise SystemExit(
                          f"{path}: plating_shield must be a JSON object"
                      )

                  reference = None
                  reference_id = None

                  for stat_id in (
                      "tconstruct:plating_chestplate",
                      "tconstruct:plating_leggings",
                      "tconstruct:plating_helmet",
                      "tconstruct:plating_boot",
                  ):
                      entry = stats.get(stat_id)

                      if (
                          isinstance(entry, dict)
                          and "durability" in entry
                      ):
                          reference = entry["durability"]
                          reference_id = stat_id
                          break

                  if reference is None:
                      raise SystemExit(
                          f"{path}: cannot infer shield durability; "
                          "no existing plating durability found."
                      )

                  shield_durability = durability_integer(
                      reference,
                      path,
                      f"{reference_id} reference",
                  )

                  if shield.get("durability") != shield_durability:
                      previous = shield.get("durability", "<missing>")
                      shield["durability"] = shield_durability
                      changed = True
                      print(
                          f"{path}: plating_shield.durability "
                          f"{previous!r} -> {shield_durability} "
                          f"(reference: {reference_id})"
                      )

              if changed:
                  path.write_text(
                      json.dumps(
                          data,
                          ensure_ascii=False,
                          indent=2,
                          allow_nan=False,
                      ) + "\n",
                      encoding="utf-8",
                  )
                  print(f"Updated: {path}")

          print(f"Processed {len(files)} material stat files.")
          PY

      - name: Validate material stat JSON
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          ROOT = Path(
              "src/main/resources/data/sakalti/tinkering/materials/stats"
          )

          PLATING_IDS = (
              "tconstruct:plating_helmet",
              "tconstruct:plating_chestplate",
              "tconstruct:plating_leggings",
              "tconstruct:plating_boot",
              "tconstruct:plating_shield",
          )

          files = sorted(ROOT.rglob("*.json"))

          if not files:
              raise SystemExit(f"No JSON files found in {ROOT}")

          for path in files:
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"Invalid JSON in {path}: {exc}")

              stats = data.get("stats", {})

              if not isinstance(stats, dict):
                  raise SystemExit(
                      f"{path}: 'stats' must be a JSON object"
                  )

              if "tconstruct:plating_boots" in stats:
                  raise SystemExit(
                      f"{path}: obsolete plating_boots ID remains"
                  )

              for stat_id in PLATING_IDS:
                  if stat_id not in stats:
                      continue

                  entry = stats[stat_id]

                  if not isinstance(entry, dict):
                      raise SystemExit(
                          f"{path}: {stat_id} must be a JSON object"
                      )

                  if "durability" in entry:
                      value = entry["durability"]

                      if (
                          isinstance(value, bool)
                          or not isinstance(value, (int, float))
                          or value <= 0
                          or int(value) != value
                      ):
                          raise SystemExit(
                              f"{path}: invalid integer durability "
                              f"for {stat_id}: {value!r}"
                          )

                      # JSON must contain an integer, not 125.0.
                      if type(value) is not int:
                          raise SystemExit(
                              f"{path}: {stat_id}.durability "
                              f"must be serialized as an integer: {value!r}"
                          )

              shield = stats.get("tconstruct:plating_shield")

              if shield is not None and "durability" not in shield:
                  raise SystemExit(
                      f"{path}: plating_shield durability is missing"
                  )

          print(f"Validated {len(files)} JSON files successfully.")
          PY

      - name: Check patch formatting
        run: git diff --check

      - name: Commit and push repairs
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/main/resources/data/sakalti/tinkering/materials/stats

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Fix Sakalti material stat durability"

          git pull --rebase origin main
          git push origin HEAD:main
