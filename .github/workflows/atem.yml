from pathlib import Path
import json
import math
import random

from PIL import Image, ImageDraw, ImageFilter


MODID = "sakalti"
SIZE = 128
SEED = 20260816

ROOT = Path(__file__).resolve().parent

TEXTURE_DIR = (
    ROOT
    / "src"
    / "main"
    / "resources"
    / "assets"
    / MODID
    / "textures"
    / "fluid"
)

# Mantleのfluid texture JSONを読むだけ。
# JSON自体は生成・変更しない。
FLUID_TEXTURE_JSON_DIR = (
    ROOT
    / "src"
    / "main"
    / "resources"
    / "assets"
    / MODID
    / "mantle"
    / "fluid_texture"
)


def clamp(value):
    return max(0, min(255, int(value)))


def mix(a, b, amount):
    return tuple(
        clamp(
            a[i] * (1.0 - amount)
            + b[i] * amount
        )
        for i in range(3)
    )


def noise(x, y, seed):
    value = (
        math.sin(
            x * 12.9898
            + y * 78.233
            + seed * 37.719
        )
        * 43758.5453
    )

    return value - math.floor(value)


def smooth_noise(x, y, seed, scale):
    total = 0.0
    amplitude = 1.0
    frequency = 1.0
    normalization = 0.0

    for octave in range(4):
        nx = x / scale * frequency
        ny = y / scale * frequency

        ix = math.floor(nx)
        iy = math.floor(ny)

        fx = nx - ix
        fy = ny - iy

        fx = fx * fx * (3.0 - 2.0 * fx)
        fy = fy * fy * (3.0 - 2.0 * fy)

        n00 = noise(
            ix,
            iy,
            seed + octave * 17,
        )

        n10 = noise(
            ix + 1,
            iy,
            seed + octave * 17,
        )

        n01 = noise(
            ix,
            iy + 1,
            seed + octave * 17,
        )

        n11 = noise(
            ix + 1,
            iy + 1,
            seed + octave * 17,
        )

        nx0 = (
            n00 * (1.0 - fx)
            + n10 * fx
        )

        nx1 = (
            n01 * (1.0 - fx)
            + n11 * fx
        )

        value = (
            nx0 * (1.0 - fy)
            + nx1 * fy
        )

        total += value * amplitude
        normalization += amplitude

        amplitude *= 0.5
        frequency *= 2.0

    return total / normalization


def seamless_noise(x, y, seed, scale):
    px = (x % SIZE) / SIZE
    py = (y % SIZE) / SIZE

    angle_x = px * math.tau
    angle_y = py * math.tau

    sx = math.cos(angle_x) * scale
    sy = math.sin(angle_x) * scale

    tx = math.cos(angle_y) * scale
    ty = math.sin(angle_y) * scale

    return smooth_noise(
        sx + tx,
        sy + ty,
        seed,
        scale,
    )


def create_fluid_texture(
    base_color,
    seed,
    flowing=False,
):
    image = Image.new(
        "RGB",
        (SIZE, SIZE),
    )

    pixels = image.load()

    dark = mix(
        base_color,
        (0, 0, 0),
        0.30,
    )

    bright = mix(
        base_color,
        (255, 255, 255),
        0.24,
    )

    for y in range(SIZE):
        for x in range(SIZE):

            if flowing:
                n = seamless_noise(
                    x,
                    y * 0.42,
                    seed,
                    16.0,
                )
            else:
                n = seamless_noise(
                    x * 0.75,
                    y * 0.75,
                    seed,
                    18.0,
                )

            fine = seamless_noise(
                x * 1.5,
                y * 1.5,
                seed + 100,
                8.0,
            )

            value = (
                0.25
                + n * 0.75
                + (fine - 0.5) * 0.12
            )

            value = max(
                0.0,
                min(1.0, value),
            )

            if value < 0.5:
                color = mix(
                    dark,
                    base_color,
                    value * 2.0,
                )
            else:
                color = mix(
                    base_color,
                    bright,
                    (value - 0.5) * 2.0,
                )

            pixels[x, y] = color

    gloss = Image.new(
        "RGBA",
        (SIZE, SIZE),
        (0, 0, 0, 0),
    )

    draw = ImageDraw.Draw(gloss)

    random.seed(seed + 5000)

    count = 28 if flowing else 24

    for _ in range(count):
        x = random.randint(
            -20,
            SIZE + 20,
        )

        y = random.randint(
            -20,
            SIZE + 20,
        )

        length = random.randint(
            12,
            42,
        )

        if flowing:
            end = (
                x + random.randint(-2, 2),
                y + length,
            )
        else:
            end = (
                x + length,
                y + random.randint(-2, 2),
            )

        draw.line(
            [(x, y), end],
            fill=(
                255,
                255,
                255,
                random.randint(18, 70),
            ),
            width=random.randint(1, 3),
        )

    gloss = gloss.filter(
        ImageFilter.GaussianBlur(1.3)
    )

    image = Image.alpha_composite(
        image.convert("RGBA"),
        gloss,
    )

    return image.convert("RGB")


def find_fluid_names():
    """
    リポジトリ内から液体名を動的に検出する。
    固定FLUIDSリストは使用しない。
    """

    names = set()

    data_fluid_dir = (
        ROOT
        / "src"
        / "main"
        / "resources"
        / "data"
        / MODID
        / "fluid"
    )

    data_tag_dir = (
        ROOT
        / "src"
        / "main"
        / "resources"
        / "data"
        / MODID
        / "tags"
        / "fluids"
    )

    # fluid JSON
    if data_fluid_dir.exists():
        for path in data_fluid_dir.rglob("*.json"):
            names.add(path.stem)

    # fluid tag JSON
    if data_tag_dir.exists():
        for path in data_tag_dir.rglob("*.json"):
            names.add(path.stem)

    # 既存PNG
    if TEXTURE_DIR.exists():
        for path in TEXTURE_DIR.glob("*.png"):
            stem = path.stem

            for suffix in (
                "_still",
                "_flow",
                "_flowing",
            ):
                if stem.endswith(suffix):
                    stem = stem[:-len(suffix)]

            if stem:
                names.add(stem)

    # Mantle JSON
    if FLUID_TEXTURE_JSON_DIR.exists():
        for path in FLUID_TEXTURE_JSON_DIR.rglob("*.json"):
            names.add(path.stem)

    valid = set()

    allowed = (
        "abcdefghijklmnopqrstuvwxyz"
        "0123456789"
        "_-."
    )

    for name in names:
        if name and all(
            char in allowed
            for char in name
        ):
            valid.add(name)

    return sorted(valid)


def read_rgba_color(name):
    """
    Mantleのfluid texture JSONからcolorを読む。

    例:
        "color": "FF00EE00"

    8文字RGBAの場合:
        FF | 00 EE 00
        ↑      ↑
        A      RGB

    先頭2文字を捨て、
    後ろ6文字だけをRGBとして使用する。
    """

    path = (
        FLUID_TEXTURE_JSON_DIR
        / f"{name}.json"
    )

    if not path.exists():
        print(
            f"[WARN] {name}: JSON not found, "
            "using deterministic fallback color."
        )

        return fallback_color(name)

    try:
        with path.open(
            "r",
            encoding="utf-8",
        ) as file:
            data = json.load(file)

        raw = str(
            data.get("color", "")
        ).strip()

        # 8文字RGBA
        if len(raw) == 8:
            rgb_hex = raw[2:]

        # 念のため6文字RGBにも対応
        elif len(raw) == 6:
            rgb_hex = raw

        else:
            raise ValueError(
                f"invalid color length: {raw!r}"
            )

        # RGBとして正しい16進数か確認
        int(rgb_hex, 16)

        color = (
            int(rgb_hex[0:2], 16),
            int(rgb_hex[2:4], 16),
            int(rgb_hex[4:6], 16),
        )

        print(
            f"[COLOR] {name}: "
            f"{raw} -> "
            f"RGB #{rgb_hex}"
        )

        return color

    except (
        OSError,
        json.JSONDecodeError,
        ValueError,
        TypeError,
    ) as error:
        print(
            f"[WARN] {name}: "
            f"invalid color ({error}), "
            "using fallback."
        )

        return fallback_color(name)


def fallback_color(name):
    """
    JSONが存在しない場合のみ使用する
    決定論的なRGB色。
    """

    value = 0

    for char in name:
        value = (
            value * 31
            + ord(char)
        ) & 0xFFFFFFFF

    rng = random.Random(
        SEED + value
    )

    return (
        rng.randint(40, 235),
        rng.randint(40, 235),
        rng.randint(40, 235),
    )


def texture_path(name, flowing):
    suffix = (
        "flow"
        if flowing
        else "still"
    )

    return (
        TEXTURE_DIR
        / f"{name}_{suffix}.png"
    )


def generate():
    print(
        "=== Sakalti Mantle PNG Generator ==="
    )

    names = find_fluid_names()

    print(
        f"Detected {len(names)} fluids."
    )

    if not names:
        raise RuntimeError(
            "No fluids detected."
        )

    TEXTURE_DIR.mkdir(
        parents=True,
        exist_ok=True,
    )

    generated = 0

    for index, name in enumerate(names):

        # ここでJSONのcolorを読む
        # FF00EE00 -> 00EE00 -> (0,238,0)
        color = read_rgba_color(name)

        seed = (
            SEED
            + index * 1000
        )

        still = create_fluid_texture(
            color,
            seed,
            flowing=False,
        )

        flowing = create_fluid_texture(
            color,
            seed + 1,
            flowing=True,
        )

        still_path = texture_path(
            name,
            flowing=False,
        )

        flowing_path = texture_path(
            name,
            flowing=True,
        )

        still.save(
            still_path,
            "PNG",
            optimize=True,
        )

        flowing.save(
            flowing_path,
            "PNG",
            optimize=True,
        )

        print(
            f"[OK] {name}: "
            f"RGB={color}"
        )

        generated += 2

    print()
    print(
        f"Generated {generated} PNG textures."
    )

    print(
        f"Detected fluids: {len(names)}"
    )


if __name__ == "__main__":
    generate()
