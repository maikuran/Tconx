name: Generate Mantle Fluid Textures

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate fluid PNG textures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Generate PNG textures
        run: |
          python tex.py

      - name: Check generated PNG files
        run: |
          echo "Generated fluid textures:"
          find src/main/resources/assets/sakalti/textures/fluid \
            -type f \
            -name "*.png" \
            | sort

      - name: Commit generated PNG textures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/main/resources/assets/sakalti/textures/fluid

          if git diff --cached --quiet; then
            echo "No PNG texture changes."
          else
            git commit -m "Generate Mantle fluid PNG textures"
            git pull --rebase
            git push
          fi
