name: Generate Mantle Fluid Textures

on:
  push:
    branches:
      - main
      - master
    paths:
      - "tex.py"
      - "src/main/java/com/sakalti/sakalti/ModFluids.java"
      - ".github/workflows/generate-fluid-textures.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate Mantle fluid textures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Generate fluids dynamically
        run: |
          python tex.py

      - name: Validate generated resources
        run: |
          set -e

          test -d src/main/resources/assets/sakalti/textures/fluid
          test -d src/main/resources/assets/sakalti/fluid

          echo "=== Textures ==="
          find src/main/resources/assets/sakalti/textures/fluid \
            -type f \
            -name "*.png" \
            | sort

          echo "=== Fluid JSON ==="
          find src/main/resources/assets/sakalti/fluid \
            -type f \
            -name "*.json" \
            | sort

      - name: Validate Mantle JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(
              "src/main/resources/assets/sakalti/fluid"
          )

          files = sorted(root.glob("*.json"))

          if not files:
              raise SystemExit(
                  "No Mantle fluid JSON files generated."
              )

          for path in files:
              data = json.loads(
                  path.read_text(encoding="utf-8")
              )

              for key in ("still", "flowing", "color"):
                  if key not in data:
                      raise SystemExit(
                          f"{path}: missing '{key}'"
                      )

                  if not isinstance(
                      data[key],
                      str
                  ):
                      raise SystemExit(
                          f"{path}: '{key}' must be a string"
                      )

              print(
                  f"[OK] {path}"
              )
          PY

      - name: Commit generated resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/main/resources/assets/sakalti/textures/fluid \
            src/main/resources/assets/sakalti/fluid

          if git diff --cached --quiet; then
            echo "No generated resource changes."
          else
            git commit \
              -m "Generate Mantle fluid resources"

            git push
          fi
