name: Generate Mantle Fluid Textures

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate fluid PNG textures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Generate RGB PNG textures
        run: python tex.py

      - name: Verify generated files
        run: |
          echo "Generated fluid PNG textures:"
          find src/main/resources/assets/sakalti/textures/fluid \
            -type f \
            -name "*.png" \
            | sort

      - name: Verify PNG count
        run: |
          COUNT=$(find src/main/resources/assets/sakalti/textures/fluid \
            -type f \
            -name "*.png" | wc -l)

          echo "PNG count: $COUNT"

          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: No PNG textures were generated."
            exit 1
          fi

      - name: Verify no generated Mantle JSON
        run: |
          if [ -d "src/main/resources/assets/sakalti/mantle/fluid_texture" ]; then
            COUNT=$(find \
              src/main/resources/assets/sakalti/mantle/fluid_texture \
              -type f \
              -name "*.json" \
              | wc -l)

            if [ "$COUNT" -ne 0 ]; then
              echo "ERROR: Fluid texture JSON files exist."
              exit 1
            fi
          fi

      - name: Check PNG files
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          directory = Path(
              "src/main/resources/assets/sakalti/textures/fluid"
          )

          files = sorted(directory.glob("*.png"))

          if not files:
              raise RuntimeError("No PNG files found.")

          for path in files:
              with Image.open(path) as image:
                  print(
                      f"{path}: mode={image.mode}, size={image.size}"
                  )

                  if image.mode != "RGB":
                      raise RuntimeError(
                          f"Not RGB: {path}"
                      )

                  if image.size != (128, 128):
                      raise RuntimeError(
                          f"Invalid size: {path}"
                      )

          print(
              f"Verified {len(files)} RGB PNG files."
          )
          PY

      - name: Commit generated PNG textures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A src/main/resources/assets/sakalti/textures/fluid
          git add -A src/main/resources/assets/sakalti/mantle

          if git diff --cached --quiet; then
            echo "No texture changes."
          else
            git commit -m "Generate fluid RGB PNG textures"
            git pull --rebase
            git push
          fi
