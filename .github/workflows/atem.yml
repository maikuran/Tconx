name: Generate Mantle Fluid Textures

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate fluid textures and fluid JSON
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Generate textures
        run: |
          python tex.py

      - name: Detect and repair Mantle fluid JSON definitions
        shell: bash
        run: |
          set -euo pipefail

          ROOT="src/main/resources/assets"

          if [ ! -d "$ROOT" ]; then
            echo "ERROR: $ROOT does not exist."
            exit 1
          fi

          found=0

          while IFS= read -r -d '' file; do
            found=1

            echo "Processing: $file"

            python - "$file" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              print(f"SKIP invalid JSON: {path}: {exc}")
              raise SystemExit(0)

          if not isinstance(data, dict):
              raise SystemExit(0)

          # Mantle FluidTexture の定義だけを対象にする。
          #
          # 既に still があるJSONは基本的に尊重する。
          # color だけの流体定義には、
          # ファイル名から対応する fluid 名を推測して追加する。
          #
          # 例:
          # molten_emerald.json
          #
          # -> still:
          # sakalti:fluid/molten_emerald_still
          #
          # -> flowing:
          # sakalti:fluid/molten_emerald_flow

          if "still" not in data:
              stem = path.stem

              if stem.startswith("molten_"):
                  namespace = path.parts[-4] if len(path.parts) >= 4 else "sakalti"

                  data["still"] = f"{namespace}:fluid/{stem}_still"
                  data["flowing"] = f"{namespace}:fluid/{stem}_flow"

                  path.write_text(
                      json.dumps(
                          data,
                          ensure_ascii=False,
                          indent=2,
                      ) + "\n",
                      encoding="utf-8",
                  )

                  print(f"  repaired: {path}")
                  print(f"  still:   {data['still']}")
                  print(f"  flowing: {data['flowing']}")

          elif "flowing" not in data:
              stem = path.stem
              namespace = path.parts[-4] if len(path.parts) >= 4 else "sakalti"

              data["flowing"] = f"{namespace}:fluid/{stem}_flow"

              path.write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2,
                  ) + "\n",
                  encoding="utf-8",
              )

              print(f"  added flowing: {path}")

          PY

          done < <(
            find "$ROOT" \
              -type f \
              -name "*.json" \
              -print0
          )

          if [ "$found" -eq 0 ]; then
            echo "No JSON files found."
          fi

      - name: Verify Mantle fluid JSON definitions
        shell: bash
        run: |
          set -euo pipefail

          ROOT="src/main/resources/assets"

          while IFS= read -r -d '' file; do
            python - "$file" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception:
              raise SystemExit(0)

          if not isinstance(data, dict):
              raise SystemExit(0)

          if not path.stem.startswith("molten_"):
              raise SystemExit(0)

          if "still" not in data:
              raise SystemExit(
                  f"ERROR: Missing 'still' in {path}"
              )

          if not isinstance(data["still"], str):
              raise SystemExit(
                  f"ERROR: 'still' must be a string in {path}"
              )

          if "flowing" not in data:
              raise SystemExit(
                  f"ERROR: Missing 'flowing' in {path}"
              )

          if not isinstance(data["flowing"], str):
              raise SystemExit(
                  f"ERROR: 'flowing' must be a string in {path}"
              )

          print(
              f"[OK] {path} -> "
              f"still={data['still']} "
              f"flowing={data['flowing']}"
          )
          PY
          done < <(
            find "$ROOT" \
              -type f \
              -name "*.json" \
              -print0
          )

      - name: Check generated textures
        shell: bash
        run: |
          set -euo pipefail

          DIR="src/main/resources/assets/sakalti/textures/fluid"

          if [ ! -d "$DIR" ]; then
            echo "ERROR: Texture directory does not exist."
            exit 1
          fi

          echo "Generated fluid textures:"
          find "$DIR" \
            -type f \
            -name "*.png" \
            | sort

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/main/resources/assets \
            tex.py

          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git commit -m "Generate Mantle fluid textures and definitions"
          git pull  --rebase
          git push
