name: Generate Mantle Fluid Textures

on:
  push:
    branches:
      - main
      - master
    paths:
      - "tex.py"
      - ".github/workflows/generate-fluid-textures.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate fluid textures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Generate textures
        run: |
          python tex.py

      - name: Check generated files
        run: |
          echo "Generated fluid textures:"
          find src/main/resources/assets/sakalti/textures/fluid \
            -type f \
            -name "*.png" \
            | sort

      - name: Verify texture count
        run: |
          COUNT=$(find src/main/resources/assets/sakalti/textures/fluid \
            -type f \
            -name "*.png" | wc -l)

          echo "Texture count: $COUNT"

          if [ "$COUNT" -ne 36 ]; then
            echo "ERROR: Expected 36 fluid textures."
            exit 1
          fi

      - name: Commit generated textures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/main/resources/assets/sakalti/textures/fluid

          if git diff --cached --quiet; then
            echo "No texture changes."
          else
            git commit -m "Generate Mantle fluid textures"
            git push
          fi
