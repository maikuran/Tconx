name: Replace TConx

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace TConx with sakalti
        shell: bash
        run: |
          set -e

          grep -RIl \
            --exclude-dir=.git \
            'TConx' . \
            | while IFS= read -r file; do
                echo "Replacing: $file"
                sed -i 's/TConx/sakalti/g' "$file"
              done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "変更はありません"
            exit 0
          fi

          git commit -m "Replace TConx with sakalti"
          git push
