name: Replace TConx　

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace
        run: |
          find . -type f -not -path './.git/*' -not -path './.github/workflows/*' -exec sed -i 's/TConx/sakalti/g; s/TCONX/SAKALTI/g; s/tconx/sakalti/g' {} +

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Replace TConx with sakalti" || exit 0
          git push origin main
