name: Remove molten_ from Tinkers JSON

on:
  workflow_dispatch:

jobs:
  replace-molten:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove molten_ from target JSON files
        run: |
          find \
            src/main/resources/data/sakalti/tconstruct/casting/table/ \
            src/main/resources/data/sakalti/tinkering/materials/definition/ \
            -type f -name '*.json' \
            -print0 | while IFS= read -r -d '' file; do
              sed -i 's/molten_//g' "$file"
            done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/main/resources/data/sakalti/tconstruct/casting/table/ \
            src/main/resources/data/sakalti/tinkering/materials/definition/

          if git diff --cached --quiet; then
            echo "変更はありません"
            exit 0
          fi

          git commit -m "Remove molten_ from Tinkers JSON"
          git push
