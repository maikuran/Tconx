name: Repair Sakalti Worldgen JSON

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sakalti-worldgen-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Pull latest changes
        run: |
          git pull --rebase origin "$GITHUB_REF_NAME"

      - name: Repair configured feature JSON
        shell: bash
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          root = Path(
              "src/main/resources/data/sakalti/worldgen/configured_feature"
          )

          if not root.is_dir():
              raise SystemExit(
                  f"ERROR: Configured feature directory not found: {root}"
              )

          # Minecraft 1.20.1 の有効なブロックタグに合わせる
          tag_fixes = {
              "minecraft:stone_ore_replaceables":
                  "minecraft:stone_ore_replaceables",
              "minecraft:nether_ore_replaceables":
                  "minecraft:base_stone_nether",
          }

          changed_files = 0
          changed_targets = 0

          def repair(node, path):
              global changed_targets

              if isinstance(node, dict):
                  for key, value in list(node.items()):
                      if key == "target" and isinstance(value, str):
                          if value not in tag_fixes:
                              raise ValueError(
                                  f"{path}: Unknown target string: {value}"
                              )

                          node[key] = {
                              "predicate_type": "minecraft:tag_match",
                              "tag": tag_fixes[value],
                          }
                          changed_targets += 1

                      elif (
                          key == "target"
                          and isinstance(value, dict)
                          and value.get("predicate_type")
                              == "minecraft:tag_match"
                          and value.get("tag")
                              == "minecraft:nether_ore_replaceables"
                      ):
                          value["tag"] = "minecraft:base_stone_nether"
                          changed_targets += 1

                      else:
                          repair(value, path)

              elif isinstance(node, list):
                  for item in node:
                      repair(item, path)

          for path in sorted(root.rglob("*.json")):
              try:
                  original = path.read_text(encoding="utf-8")
                  data = json.loads(original)
              except (OSError, UnicodeError, json.JSONDecodeError) as exc:
                  raise SystemExit(
                      f"ERROR: Cannot read JSON {path}: {exc}"
                  ) from exc

              before = json.dumps(
                  data, ensure_ascii=False, indent=2
              ) + "\n"

              repair(data, path)

              after = json.dumps(
                  data, ensure_ascii=False, indent=2
              ) + "\n"

              if after != before:
                  path.write_text(after, encoding="utf-8")
                  changed_files += 1
                  print(f"REPAIRED: {path}")

          print(f"Changed files: {changed_files}")
          print(f"Changed targets: {changed_targets}")
          PY

      - name: Validate all resource JSON files
        shell: bash
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          root = Path("src/main/resources")
          files = sorted(root.rglob("*.json"))

          if not files:
              raise SystemExit("ERROR: No resource JSON files found.")

          errors = []

          for path in files:
              try:
                  with path.open("r", encoding="utf-8") as file:
                      json.load(file)
              except (OSError, UnicodeError, json.JSONDecodeError) as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("\n".join(errors))
              raise SystemExit("JSON validation failed.")

          print(f"JSON syntax OK: {len(files)} files")
          PY

      - name: Check patch
        run: git diff --check

      - name: Commit and push repairs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/main/resources/data/sakalti/worldgen/configured_feature
          git commit -m "Fix Sakalti world generation JSON"
          git pull
          git push
