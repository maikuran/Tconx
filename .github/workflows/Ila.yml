
name: Repair Sakalti Worldgen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sakalti-worldgen-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Repair configured feature JSON
        shell: bash
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          root = Path(
              "src/main/resources/data/sakalti/worldgen/configured_feature"
          )

          if not root.is_dir():
              raise SystemExit(
                  f"ERROR: Directory not found: {root}"
              )

          changed_files = 0

          def repair(node, path):
              changed = False

              if isinstance(node, dict):
                  # OreConfiguration の必須設定を補完
                  if "targets" in node and "size" in node:
                      if "discard_chance_on_air_exposure" not in node:
                          node["discard_chance_on_air_exposure"] = 0.0
                          changed = True

                  # 古い文字列形式の target を RuleTest 形式へ変換
                  for key, value in list(node.items()):
                      if key == "target" and isinstance(value, str):
                          tag_map = {
                              "minecraft:stone_ore_replaceables":
                                  "minecraft:stone_ore_replaceables",
                              "minecraft:nether_ore_replaceables":
                                  "minecraft:base_stone_nether",
                          }

                          if value not in tag_map:
                              raise SystemExit(
                                  f"ERROR: Unknown target in {path}: {value}"
                              )

                          node[key] = {
                              "predicate_type": "minecraft:tag_match",
                              "tag": tag_map[value],
                          }
                          changed = True

                      elif (
                          key == "target"
                          and isinstance(value, dict)
                          and value.get("predicate_type")
                              == "minecraft:tag_match"
                          and value.get("tag")
                              == "minecraft:nether_ore_replaceables"
                      ):
                          value["tag"] = "minecraft:base_stone_nether"
                          changed = True

                      else:
                          if repair(value, path):
                              changed = True

              elif isinstance(node, list):
                  for item in node:
                      if repair(item, path):
                          changed = True

              return changed

          for path in sorted(root.rglob("*.json")):
              try:
                  original = path.read_text(encoding="utf-8")
                  data = json.loads(original)
              except (OSError, UnicodeError, json.JSONDecodeError) as exc:
                  raise SystemExit(
                      f"ERROR: Invalid JSON {path}: {exc}"
                  ) from exc

              if repair(data, path):
                  path.write_text(
                      json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                      encoding="utf-8",
                  )
                  changed_files += 1
                  print(f"REPAIRED: {path}")

          print(f"Repaired files: {changed_files}")
          PY

      - name: Validate resource JSON
        shell: bash
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          root = Path("src/main/resources")
          files = sorted(root.rglob("*.json"))

          if not files:
              raise SystemExit("ERROR: No JSON resource files found")

          errors = []

          for path in files:
              try:
                  with path.open(encoding="utf-8") as file:
                      json.load(file)
              except (OSError, UnicodeError, json.JSONDecodeError) as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("\n".join(errors))
              raise SystemExit("JSON validation failed")

          print(f"JSON syntax OK: {len(files)} files")
          PY

      - name: Check patch
        run: git diff --check

      - name: Commit and push repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config pull.rebase true
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/main/resources/data/sakalti/worldgen/configured_feature

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Fix Sakalti world generation JSON"
          git pull
          git push
