name: Fix TConstruct Alloys

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-alloys:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest main
        run: |
          git pull --ff-only origin main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fix alloy JSON
        run: |
          python onc.py

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("src/main/resources/data/sakalti/tconstruct/alloys")

          if not root.exists():
              raise SystemExit(f"Directory not found: {root}")

          files = sorted(root.glob("*.json"))

          for path in files:
              with path.open("r", encoding="utf-8") as f:
                  data = json.load(f)

              if "result" not in data:
                  raise SystemExit(f"Missing result: {path}")

              result = data["result"]

              if "fluid" not in result:
                  raise SystemExit(f"Missing result.fluid: {path}")

              if "amount" not in result:
                  raise SystemExit(f"Missing result.amount: {path}")

              print(f"[OK] {path}")

          print(f"Validated {len(files)} alloy files.")
          PY

      - name: Check changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/main/resources/data/sakalti/tconstruct/alloys/
          git add onc.py

          git commit -m "Fix TConstruct alloy JSON"

          git pull --rebase origin main
          git push origin main

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "No alloy changes."
