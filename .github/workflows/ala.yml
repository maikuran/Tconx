name: Fix TConstruct Alloys

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-alloys:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest main
        run: |
          git pull --rebase origin main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run onc.py
        run: |
          test -f onec.py
          python onec.py

      - name: Validate alloy JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("src/main/resources/data/sakalti/tconstruct/alloys")

          if not root.exists():
              raise SystemExit(f"Missing directory: {root}")

          files = sorted(root.glob("*.json"))

          if not files:
              raise SystemExit("No alloy JSON files found.")

          for path in files:
              with path.open("r", encoding="utf-8") as f:
                  data = json.load(f)

              if data != {
                  "result": {
                      "fluid": f"sakalti:molten_{path.stem}",
                      "amount": data["result"]["amount"]
                  }
              }:
                  raise SystemExit(f"Invalid alloy format: {path}")

              print(f"[VALID] {path}")

          print(f"Validated {len(files)} alloy files.")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit --allow-empty -m "Fix TConstruct alloy JSON"

          git pull --rebase origin main
          git push origin main
