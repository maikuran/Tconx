name: Fix Stat and Lang Boot Names

on:
  workflow_dispatch:
  push:
    branches:
      - mai

permissions:
  contents: write

jobs:
  fix-boot-names:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace ss with s in all JSON files
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          # sakaltiデータディレクトリ全体を対象にする (サブディレクトリも含む)
          root = Path(
              "src/main/resources/data/sakalti"
          )

          if not root.is_dir():
              raise SystemExit(f"Directory not found: {root}")

          changed = 0

          # rglobを使うことで配下のすべてのサブディレクトリのJSONを再帰的に検索・置換
          for path in sorted(root.rglob("*.json")):
              with path.open("r", encoding="utf-8") as f:
                  content = f.read()

              # 文字列 "ss" をすべて "s" に強力に置換
              updated = content.replace("ss", "s")

              if updated != content:
                  with path.open(
                      "w", encoding="utf-8", newline="\n"
                  ) as f:
                      f.write(updated)

                  changed += 1
                  print(f"Updated: {path.relative_to(root)}")

          print(f"Updated {changed} JSON files.")
          PY

      - name: Validate JSON files
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          root = Path(
              "src/main/resources/data/sakalti"
          )

          for path in sorted(root.rglob("*.json")):
              with path.open("r", encoding="utf-8") as f:
                  json.load(f)

          print("All JSON files are valid.")
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/main/resources/data/sakalti

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Strongly replace ss with s in all sakalti JSON files"
          git pull --rebase
          git push
