name: Fix TConstruct Alloys

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-alloys:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest main
        run: |
          git pull --rebase origin main

      - name: Convert alloy JSON
        shell: bash
        run: |
          set -e

          ROOT="src/main/resources/data/sakalti/tconstruct/alloys"

          test -d "$ROOT"

          find "$ROOT" -type f -name '*.json' -print0 |
          while IFS= read -r -d '' file; do

            jq '
              {
                type: "tconstruct:alloy",

                inputs: (
                  .inputs // []
                  | map({
                      fluid: .fluid,
                      amount: .amount
                    })
                ),

                result: {
                  fluid: .result.fluid,
                  amount: .result.amount
                },

                temperature: .temperature
              }
            ' "$file" > "$file.tmp"

            mv "$file.tmp" "$file"

            echo "Fixed: $file"
          done

      - name: Validate JSON
        shell: bash
        run: |
          set -e

          ROOT="src/main/resources/data/sakalti/tconstruct/alloys"

          find "$ROOT" -type f -name '*.json' -print0 |
          while IFS= read -r -d '' file; do
            jq empty "$file"

            jq -e '
              .type == "tconstruct:alloy"
              and (.inputs | type == "array")
              and (.inputs | all(
                (.fluid | type == "string")
                and (.amount | type == "number")
              ))
              and (.result | type == "object")
              and (.result.fluid | type == "string")
              and (.result.amount | type == "number")
              and (.temperature | type == "number")
            ' "$file" > /dev/null

            echo "Valid: $file"
          done

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit --allow-empty -m "Fix TConstruct alloy JSON"

          git pull --rebase origin main
          git push origin main
