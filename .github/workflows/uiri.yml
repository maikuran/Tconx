name: Fix TConstruct Alloys

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-alloys:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git pull --rebase origin main

      - name: Convert alloy JSON
        shell: bash
        run: |
          set -euo pipefail

          ROOT="src/main/resources/data/sakalti/tconstruct/alloys"

          if [ ! -d "$ROOT" ]; then
            echo "ERROR: Directory not found: $ROOT"
            exit 1
          fi

          found=0

          while IFS= read -r -d '' file; do
            found=1
            echo "Processing: $file"

            tmp="${file}.tmp"

            jq '
              {
                type: "tconstruct:alloy",

                inputs: (
                  (.inputs // [])
                  | map(
                      {
                        fluid:
                          (
                            if (.fluid? | type) == "string"
                               and (.fluid | length) > 0
                            then .fluid
                            elif (.name? | type) == "string"
                                 and (.name | length) > 0
                            then .name
                            else
                              error("Input is missing fluid/name")
                            end
                          ),
                        amount: .amount
                      }
                    )
                ),

                result:
                  {
                    fluid:
                      (
                        if (.result.fluid? | type) == "string"
                           and (.result.fluid | length) > 0
                        then .result.fluid
                        elif (.result.name? | type) == "string"
                             and (.result.name | length) > 0
                        then .result.name
                        else
                          error("Result is missing fluid/name")
                        end
                      ),
                    amount: .result.amount
                  },

                temperature: .temperature
              }
            ' "$file" > "$tmp"

            mv "$tmp" "$file"

          done < <(
            find "$ROOT" \
              -type f \
              -name '*.json' \
              -print0
          )

          if [ "$found" -eq 0 ]; then
            echo "ERROR: No alloy JSON files found."
            exit 1
          fi

      - name: Validate JSON
        shell: bash
        run: |
          set -euo pipefail

          ROOT="src/main/resources/data/sakalti/tconstruct/alloys"

          count=0
          failed=0

          while IFS= read -r -d '' file; do
            count=$((count + 1))

            echo "Validating: $file"

            # JSONとして正しいか
            if ! jq empty "$file"; then
              echo "ERROR: Invalid JSON: $file"
              failed=1
              continue
            fi

            # TConstruct alloy形式を検証
            if ! jq -e '
              (.type == "tconstruct:alloy")
              and
              (.inputs | type == "array")
              and
              ((.inputs | length) > 0)
              and
              (
                [.inputs[] |
                  (
                    (.fluid | type == "string")
                    and
                    ((.fluid | length) > 0)
                    and
                    (.amount | type == "number")
                    and
                    (.amount > 0)
                  )
                ]
                | all
              )
              and
              (.result | type == "object")
              and
              (.result.fluid | type == "string")
              and
              ((.result.fluid | length) > 0)
              and
              (.result.amount | type == "number")
              and
              (.result.amount > 0)
              and
              (.temperature | type == "number")
              and
              (.temperature > 0)
            ' "$file" > /dev/null; then
              echo "ERROR: Invalid TConstruct alloy structure:"
              cat "$file"
              failed=1
              continue
            fi

            echo "OK: $file"

          done < <(
            find "$ROOT" \
              -type f \
              -name '*.json' \
              -print0
          )

          if [ "$count" -eq 0 ]; then
            echo "ERROR: No alloy JSON files found."
            exit 1
          fi

          if [ "$failed" -ne 0 ]; then
            echo "ERROR: Alloy validation failed."
            exit 1
          fi

          echo "Successfully validated $count alloy files."

      - name: Show generated files
        shell: bash
        run: |
          set -euo pipefail

          ROOT="src/main/resources/data/sakalti/tconstruct/alloys"

          find "$ROOT" \
            -type f \
            -name '*.json' \
            -print \
            -exec cat {} \;

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit --allow-empty \
            -m "Fix TConstruct alloy JSON"

      - name: Push changes
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
