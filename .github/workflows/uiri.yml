name: Fix TConstruct Alloys

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-alloys:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Fetch latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Convert alloy JSON
        shell: bash
        run: |
          set -euo pipefail

          ROOT="src/main/resources/data/sakalti/tconstruct/alloys"

          if [ ! -d "$ROOT" ]; then
            echo "Directory not found: $ROOT"
            exit 1
          fi

          found=0

          while IFS= read -r -d '' file; do
            found=1
            echo "Processing: $file"

            jq '
              . as $old
              |
              {
                type: "tconstruct:alloy",

                inputs:
                  (
                    if ($old.inputs | type) == "array" then
                      $old.inputs
                    else
                      []
                    end
                  ),

                result:
                  {
                    fluid:
                      (
                        if ($old.result | type) == "object"
                        and ($old.result.fluid | type) == "string"
                        then
                          $old.result.fluid
                        else
                          error("result.fluid is missing: " + input_filename)
                        end
                      ),

                    amount:
                      (
                        if ($old.result | type) == "object"
                        and ($old.result.amount | type) == "number"
                        then
                          $old.result.amount
                        else
                          error("result.amount is missing: " + input_filename)
                        end
                      )
                  },

                temperature:
                  (
                    if ($old.temperature | type) == "number" then
                      $old.temperature
                    else
                      error("temperature is missing: " + input_filename)
                    end
                  )
              }
            ' "$file" > "${file}.tmp"

            mv "${file}.tmp" "$file"

            echo "Fixed: $file"

          done < <(find "$ROOT" -type f -name '*.json' -print0)

          if [ "$found" -eq 0 ]; then
            echo "No alloy JSON files found."
            exit 1
          fi

      - name: Validate JSON
        shell: bash
        run: |
          set -euo pipefail

          ROOT="src/main/resources/data/sakalti/tconstruct/alloys"

          while IFS= read -r -d '' file; do
            echo "Validating: $file"

            jq empty "$file"

            jq -e '
              (.type == "tconstruct:alloy")
              and (.inputs | type == "array")
              and (
                .inputs
                | all(
                    (.fluid | type == "string")
                    and (.amount | type == "number")
                  )
              )
              and (.result | type == "object")
              and (.result.fluid | type == "string")
              and (.result.amount | type == "number")
              and (.temperature | type == "number")
            ' "$file" > /dev/null

          done < <(find "$ROOT" -type f -name '*.json' -print0)

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/main/resources/data/sakalti/tconstruct/alloys/

          git commit --allow-empty \
            -m "Fix TConstruct alloy JSON"

      - name: Push changes
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD:main
