name: Replace crafting_shapeles in recipes
on:
  workflow_dispatch:

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace typo in recipes
        run: |
          find recipes -type f -exec sed -i 's/crafting_shapeles/crafting_shapeless/g' {} +

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipes
          git diff --cached --quiet || git commit -m "Fix crafting_shapeless typo"
          git pull --rebase
          git push
