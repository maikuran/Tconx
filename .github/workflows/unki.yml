name: Generate Item Models

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-models:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate missing item model JSON files
        shell: bash
        run: |
          set -e

          BASE="src/main/resources/assets/sakalti"
          ITEMS="$BASE/models/item"
          BLOCKSTATES="$BASE/blockstates"

          mkdir -p "$ITEMS"

          echo "Generating item models..."

          # blockstates に存在するブロックのアイテムモデルを生成
          if [ -d "$BLOCKSTATES" ]; then
            find "$BLOCKSTATES" -type f -name "*.json" -print0 |
            while IFS= read -r -d '' blockstate; do
              id="$(basename "$blockstate" .json)"
              file="$ITEMS/$id.json"

              if [ -f "$file" ]; then
                continue
              fi

              printf '%s\n' \
                '{' \
                "  \"parent\": \"sakalti:block/$id\"" \
                '}' \
                > "$file"

              echo "Generated block item model: $id"
            done
          fi

          # Javaソースから register("item_id") を検索
          if [ -d "src/main/java" ]; then
            grep -RhoE \
              'register\("([a-z0-9_]+)"' \
              src/main/java 2>/dev/null |
            sed -E 's/register\("([^"]+)"/\1/' |
            sort -u |
            while IFS= read -r id; do

              [ -z "$id" ] && continue

              file="$ITEMS/$id.json"

              if [ -f "$file" ]; then
                continue
              fi

              printf '%s\n' \
                '{' \
                '  "parent": "minecraft:item/generated",' \
                '  "textures": {' \
                "    \"layer0\": \"sakalti:item/$id\"" \
                '  }' \
                '}' \
                > "$file"

              echo "Generated item model: $id"
            done
          fi

          echo ""
          echo "=== Item models ==="
          find "$ITEMS" -type f -name "*.json" | sort

      - name: Commit generated models
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/main/resources/assets/sakalti/models/item

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Generate missing item models"
          git push origin HEAD:main
