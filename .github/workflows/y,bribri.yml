name: Generate Tinkers' Construct traits.json

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-traits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate traits.json
        shell: bash
        run: |
          mkdir -p src/main/resources/data/sakalti/tconstruct/materials

          python3 - <<'PY'
          import json
          from pathlib import Path

          traits = [
              "glacial_bind",
              "supermagnet",
              "ice_bind",
              "weak_burn",
              "light_touch",
              "fire_wall",
              "lifesteal",
              "long_spark",
              "laser_prism",
              "poisonous_bind",
              "heavy_stone",
              "jumpy",
              "berserk",
              "unstable",
              "fieldy",
              "auro_vision"
          ]

          path = Path(
              "src/main/resources/data/sakalti/tconstruct/materials/traits.json"
          )

          data = {
              "glacial_bind": "sakalti:glacial_bind",
              "supermagnet": "sakalti:supermagnet",
              "ice_bind": "sakalti:ice_bind",
              "weak_burn": "sakalti:weak_burn",
              "light_touch": "sakalti:light_touch",
              "fire_wall": "sakalti:fire_wall",
              "lifesteal": "sakalti:lifesteal",
              "long_spark": "sakalti:long_spark",
              "laser_prism": "sakalti:laser_prism",
              "poisonous_bind": "sakalti:poisonous_bind",
              "heavy_stone": "sakalti:heavy_stone",
              "jumpy": "sakalti:jumpy",
              "berserk": "sakalti:berserk",
              "unstable": "sakalti:unstable",
              "fieldy": "sakalti:fieldy",
              "auro_vision": "sakalti:auro_vision"
          }

          path.write_text(
              json.dumps(data, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )

          print(f"Generated {path}")
          print(f"Traits: {len(traits)}")
          PY

      - name: Commit generated traits.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/data/sakalti/tconstruct/materials/traits.json
          git diff --cached --quiet || git commit -m "Generate TConX material traits"
          git push
