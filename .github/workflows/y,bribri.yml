name: Generate Tinkers Construct traits

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-traits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate material trait files
        shell: bash
        run: |
          mkdir -p src/main/resources/data/sakalti/tinkering/materials/traits

          python3 -c '
          import json
          from pathlib import Path

          traits = [
              "glacial_bind",
              "supermagnet",
              "ice_bind",
              "weak_burn",
              "light_touch",
              "fire_wall",
              "lifesteal",
              "long_spark",
              "laser_prism",
              "poisonous_bind",
              "heavy_stone",
              "jumpy",
              "berserk",
              "unstable",
              "fieldy",
              "auro_vision"
          ]

          base = Path("src/main/resources/data/sakalti/tinkering/materials/traits")
          base.mkdir(parents=True, exist_ok=True)

          for trait in traits:
              data = {
                  "default": [
                      {
                          "name": f"sakalti:{trait}"
                      }
                  ]
              }

              path = base / f"{trait}.json"
              path.write_text(
                  json.dumps(data, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8"
              )

              print(f"Generated: {path}")

          print(f"Generated {len(traits)} trait files.")
          '

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/main/resources/data/sakalti/tinkering/materials/traits/

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Generate TConX material trait files"
            git push
          fi
