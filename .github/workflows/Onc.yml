name: Generate TConstruct Material Renders

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-material-renders:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull main
        run: git pull --ff-only origin main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate
        run: python onc.py

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("src/main/resources/assets/sakalti/tinkering/materials")

          if not root.exists():
              raise SystemExit(f"Directory not found: {root}")

          files = sorted(root.rglob("*.json"))

          if not files:
              raise SystemExit("No material render JSON files found.")

          for path in files:
              try:
                  with path.open(encoding="utf-8") as f:
                      json.load(f)
              except Exception as e:
                  raise SystemExit(f"Invalid JSON: {path}\n{e}")

              print(f"[VALID] {path}")

          print(f"Validated {len(files)} files.")
          PY

      - name: Check changes
        id: changes
        run: |
          if git status --porcelain -- src/main/resources/assets/sakalti/tinkering/materials/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/main/resources/assets/sakalti/tinkering/materials/
          git commit -m "Generate TConstruct material renders"

          git pull --rebase origin main
          git push origin HEAD:main

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "No changes."
