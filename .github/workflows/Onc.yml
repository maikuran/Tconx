# .github/workflows/render.yml
name: Generate TConstruct Material Renders

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Pull latest main
        run: |
          git pull --ff-only origin main

      - name: Generate renders
        run: |
          python onc.py

      - name: Validate renders
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(
              "src/main/resources/assets/sakalti/tinkering/materials"
          )

          files = sorted(root.glob("*.json"))

          if not files:
              raise SystemExit("No render JSON files found.")

          for path in files:
              with path.open("r", encoding="utf-8") as f:
                  data = json.load(f)

              if "color" not in data:
                  raise SystemExit(f"Missing color: {path}")

              if "fallbacks" not in data:
                  raise SystemExit(f"Missing fallbacks: {path}")

              print(f"[VALID] {path}")

          print(f"Validated {len(files)} render files.")
          PY

      - name: Check changes
        id: changes
        run: |
          if git status --porcelain -- \
            src/main/resources/assets/sakalti/tinkering/materials/ \
            | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/main/resources/assets/sakalti/tinkering/materials/

          git commit -m "Generate TConstruct material renders"

      - name: Push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git pull --rebase origin main
          git push origin HEAD:main

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "No changes."
