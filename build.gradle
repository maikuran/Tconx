plugins {
    id 'net.minecraftforge.gradle' version '6.0.24'
    id 'java'
}

sourceSets {
    main {
        resources {
            srcDir 'src/main/resources'
        }
    }
}

group = 'com.sakalti'
archivesBaseName = 'sakalti'
version = '1.0.0'

java {
    toolchain {
        // 1.16.5はJava 8で動作します
        languageVersion = JavaLanguageVersion.of(8)
    }
}

minecraft {
    // 1.16.5用の公式マッピングを指定
    mappings channel: 'official', version: '1.16.5'

    runs {
        client {
            workingDirectory project.file('run')
        }
        server {
            workingDirectory project.file('run')
        }
    }
}

repositories {
    maven {
        name = 'forge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'blamejared'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
    mavenCentral()
}

dependencies {
    // Minecraft Forge 1.16.5 の最新安定版を指定
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.42'
    
    // 1.16.5 向けの Mantle と Tinkers' Construct (CurseMaven)
    compileOnly fg.deobf("curse.maven:mantle-74924:3631982")
    compileOnly fg.deobf("curse.maven:tinkers-construct-74072:3695126")
}

jar {
    manifest {
        attributes(
            'Specification-Title': 'sakalti',
            'Specification-Vendor': 'sakalti',
            'Specification-Version': '1.0.0',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'sakalti'
        )
    }
}

processResources {
    duplicatesStrategy = 'INCLUDE'
}
