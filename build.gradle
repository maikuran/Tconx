plugins {
    id 'net.minecraftforge.gradle' version '5.1.+'
    id 'java'
}

sourceSets {
    main {
        resources {
            srcDir 'src/main/resources'
        }
    }
}

group = 'com.sakalti'
archivesBaseName = 'sakalti'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

minecraft {
    mappings channel: 'official', version: '1.16.5'

    runs {
        client {
            workingDirectory project.file('run')

            mods {
                sakalti {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            mods {
                sakalti {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven {
        name = 'forge'
        url = 'https://maven.minecraftforge.net/'
    }

    maven {
        name = 'blamejared'
        url = 'https://maven.blamejared.com/'
    }

    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }

    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.42'

    implementation fg.deobf('curse.maven:mantle-74924:3631982')
    implementation fg.deobf('curse.maven:tinkers-construct-74072:3695126')
}

jar {
    manifest {
        attributes(
            'Specification-Title': 'sakalti',
            'Specification-Vendor': 'sakalti',
            'Specification-Version': '1.0.0',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'sakalti'
        )
    }
}

processResources {
    duplicatesStrategy = 'INCLUDE'
}
